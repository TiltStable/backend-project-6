# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: task-manager-tiltstable
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      # fastify-cli binds to localhost unless an address is given or a container is detected
      - key: FASTIFY_ADDRESS
        value: 0.0.0.0
      # Generated by Render on first deploy; never stored in the repository
      - key: SESSION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-tiltstable-db
          property: connectionString

databases:
  - name: task-manager-tiltstable-db
    plan: free
    region: frankfurt
